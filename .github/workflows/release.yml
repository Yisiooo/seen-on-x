name: Release extension

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Package extension
        run: cd dist && zip -r ../seen-on-x-extension.zip .

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: seen-on-x-extension
          path: seen-on-x-extension.zip

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" seen-on-x-extension.zip \
            --title "$GITHUB_REF_NAME" \
            --notes "Download seen-on-x-extension.zip, unzip it, then load the extracted folder as an unpacked Chrome/Edge extension."
